name: keepalive

# GitHub disabilita i workflow schedulati dopo 60 giorni senza attività nel
# repo. build-feeds pubblica su Pages senza commit, quindi un commit mensile
# di last-update.txt tiene il repo "attivo".

on:
  schedule:
    - cron: "37 3 1 * *"   # il primo di ogni mese
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggiorna last-update.txt
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-update.txt
          git commit -m "keepalive"
          git push
